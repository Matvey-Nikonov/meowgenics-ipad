# Requires Mesa 25.1.9 plus the statically linked Wine Vulkan/MoltenVK bridge.
env.GALLIUM_DRIVER = zink
env.WINEDLLOVERRIDES = opengl32=n
env.MESA_GL_VERSION_OVERRIDE = 4.4
env.MESA_GLSL_VERSION_OVERRIDE = 440
display.native = 1
pool = 384
# Normal play: retain errors/lifecycle logs without continuous graphics inspection.
env.MADEIRA_VULKAN_DIAGNOSTICS = 0
env.MADEIRA_DEVICE_STATS = 0
env.MADEIRA_UI_LOG_IDLE = 1
env.MADEIRA_DEBUG_VERBOSE = 0
